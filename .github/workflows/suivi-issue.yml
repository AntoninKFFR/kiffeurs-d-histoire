name: Suivi des issues

# À la fusion d'une PR sur main : libère l'issue visée (label « en cours » et 🚧)
# et coche son étape dans l'issue de suivi de la roadmap concernée (#20 pour la V1.3 dans le dépôt d'Antonin ; #31 et #98 étaient ceux de l'ancien dépôt).
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  issues: write
  pull-requests: read

# Une seule mise à jour des roadmaps à la fois (deux fusions rapprochées).
concurrency:
  group: suivi-issue
  cancel-in-progress: false

jobs:
  mettre-a-jour:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const SUIVIS = [20];
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            // Issues visées : « Closes #N » dans la description (une PR de lot intermédiaire,
            // sans « Closes », ne libère rien).
            const numeros = new Set();
            for (const m of (pr.body || '').matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)) {
              numeros.add(Number(m[1]));
            }
            for (const suivi of SUIVIS) {
              numeros.delete(suivi);
            }

            if (numeros.size === 0) {
              core.info('Aucune issue visée par cette PR, rien à faire.');
              return;
            }

            // 1. Libérer chaque issue : label « en cours » et 🚧 du titre.
            for (const numero of numeros) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: numero, name: 'en cours' });
              } catch (e) {
                if (e.status !== 404) throw e; // le label n'y était pas : rien à retirer
              }
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: numero });
              const titre = issue.title.replace(/^🚧\s*/, '');
              if (titre !== issue.title) {
                await github.rest.issues.update({ owner, repo, issue_number: numero, title: titre });
              }
            }

            // 2. Cocher les étapes dans leur roadmap (corps relu juste avant chaque écriture).
            const trouves = new Set();
            for (const numeroSuivi of SUIVIS) {
              const { data: suivi } = await github.rest.issues.get({ owner, repo, issue_number: numeroSuivi });
              let corps = suivi.body || '';
              let change = false;
              for (const numero of numeros) {
                const ligne = new RegExp(`^- \\[[ x]\\] (?:🚧 )?(#${numero} .*)$`, 'm');
                const m = corps.match(ligne);
                if (!m) continue;
                trouves.add(numero);
                let texte = m[1];
                if (!texte.includes(`PR #${pr.number}`)) {
                  texte += ` (PR #${pr.number})`;
                }
                corps = corps.replace(ligne, `- [x] ${texte}`);
                change = true;
              }
              if (change) {
                await github.rest.issues.update({ owner, repo, issue_number: numeroSuivi, body: corps });
              }
            }
            for (const numero of numeros) {
              if (!trouves.has(numero)) {
                core.warning(`#${numero} n'a pas de ligne dans les roadmaps ${SUIVIS.map(n => `#${n}`).join(', ')}.`);
              }
            }
