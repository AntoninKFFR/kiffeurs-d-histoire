<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="maq.css"><script src="maq.js"></script>
<style>
body{font-size:12px}
.q{position:absolute;left:56px;right:150px;top:6px;text-align:center}
.q h2{font-size:19px;line-height:1.1}
.chrono{position:absolute;left:8px;top:8px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--oxyde) 0 60%,#e6e8e1 60% 100%)}
.chrono div{width:36px;height:36px;border-radius:50%;background:var(--cartel);display:grid;place-items:center;font-size:19px}
.mini{position:absolute;right:8px;top:8px;width:136px;background:rgb(251 251 248/.92);border:1px solid var(--filet)}
.mini .l{display:grid;grid-template-columns:12px 18px 1fr auto;gap:4px;align-items:center;padding:2px 6px;font-size:11px}
.mini .l .pion{width:18px;height:18px;font-size:9px}
.mini .l.moi{background:var(--resultat)}
.mini .l span:nth-child(3){white-space:nowrap;overflow:hidden}
.mini .l b{font-family:"Big Shoulders";font-size:14px}
.mini .plus{font-size:10px;color:var(--encre-douce);text-align:center;border-top:1px solid #e6e8e1;padding:1px}
.grad{font-size:16px}
.curseur .nom{font-size:9px;padding:0 4px}
.bas{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:8px;align-items:stretch}
.bas input{font:700 30px "Big Shoulders";color:var(--oxyde);width:110px;border:1px solid var(--filet);border-bottom:2px solid var(--encre);background:var(--cartel);padding:0 6px}
.bas button{flex:1;font-size:15px}
.bas .emote{width:44px;height:auto}
</style></head><body><div class="ecran">
<div class="chrono"><div class="date">18</div></div>
<div class="q"><div class="inv" style="font-size:9px">Q4/10 · <span class="ok" style="font-family:Atkinson Hyperlegible;text-transform:none">2/5 ont validé</span></div><h2 class="titre">Prise de la Bastille</h2><div style="font-weight:700;font-size:11px">À trouver : l'année</div></div>
<div class="mini">
 <div class="l"><span>1</span><span class="pion" style="background:var(--j2)">A</span><span>Antonin ✓</span><b>2 340</b></div>
 <div class="l moi"><span>2</span><span class="pion" style="background:var(--j1)">M</span><span>Maxou</span><b>2 210</b></div>
 <div class="l"><span>3</span><span class="pion" style="background:var(--j3)">L</span><span>Lulu_1515 ✓</span><b>2 190</b></div>
 <div class="plus">+2 joueurs ▾</div>
</div>
<div class="frise" id="f" style="top:0;bottom:0" data-min="1760" data-max="1832" data-axe="236"></div>
<div class="bas"><input value="1799"><button class="btn-encre">Valider</button><span class="emote">😂</span></div>
</div>
<script>
const f=document.getElementById("f");dessinerFrise(f,20);const yA=+f.dataset.axe;
function autre(an,nom,coul,v,h){f.insertAdjacentHTML("beforeend",`<div class="curseur" style="left:${x(an,f)}px;top:${yA-24-h}px;opacity:${v?.95:.7}"><span class="nom" style="background:${coul}">${nom}${v?" ✓":""}</span><span class="tige" style="background:${coul};height:${12+h}px"></span></div>`)}
autre(1789,"Antonin","var(--j2)",1,40);autre(1792,"Lulu","var(--j3)",1,8);autre(1776,"Clément","var(--j4)",0,20);
f.insertAdjacentHTML("beforeend",`<div class="marq" style="left:${x(1799,f)}px;top:${yA+2}px;background:var(--oxyde)"></div>`);
</script></body></html>
