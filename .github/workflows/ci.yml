name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verifier:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          # Le contrôle d'intégrité compare les octets au main de référence #111.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 scripts/verifier-chapitres.py --exiger-validation --exiger-cinq-partout
      - run: python3 scripts/verifier-alias.py
      - run: python3 scripts/verifier-descriptions.py --exiger-revue-documentaire
      - run: python3 scripts/test-verifier-descriptions.py
      - run: npm test
      - run: npx tsx scripts/build-structure-pedagogique.ts --check
      - run: npx tsx scripts/phase3-pedagogie.ts
      - run: python3 scripts/verifier-illustrations.py
      - run: npm run content:planches-phase4
      - run: npm run content:verifier-phase4
      - run: npm run content:audit-plages -- --strict
      - run: npm run content:relecture-cartes -- --check
      - run: npm run lint
      - run: npm run typecheck
      - run: npx tsx scripts/build-apprendre-local.ts
      - run: npm run content:test-demo-pedagogie
      - run: npx tsx scripts/verifier-apprendre.ts
      - run: npx playwright install --with-deps chromium
      - name: Les 292 illustrations de la fixture à deux largeurs
        env:
          PHASE4_BROWSER: "1"
        run: npx vitest run tests/illustrations-phase4.test.ts
      - run: npm run test:profil-browser
      - run: npm run test:bilan-browser
      - run: npm run test:sous-packs-browser

  tests-cartes-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Les clés éphémères du démarrage restent dans le runner, pas dans les logs.
      - run: npx supabase start --exclude studio,logflare,vector,supavisor,edge-runtime,imgproxy > /tmp/supabase-local-start.txt
      - run: npm run db:reset -- --local
      - run: npm run content:test-cartes-local
      - if: always()
        run: npx supabase stop --no-backup

  # Parcours V1 joués dans un vrai navigateur (#27), sur une pile Supabase locale jetable.
  tests-bout-en-bout:
    runs-on: ubuntu-latest
    # La préparation Docker/Supabase peut prendre 12+ min ; laisser le temps aux 286 parcours Playwright.
    # Conserver la suite complète et ses limites individuelles.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # La fixture vérifie le corpus et les SVG contre le SHA humain approuvé.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Les clés éphémères du démarrage restent dans le runner, pas dans les logs.
      - run: npx supabase start --exclude studio,logflare,vector,supavisor,edge-runtime,imgproxy,realtime,storage-api,postgres-meta,mailpit > /tmp/supabase-local-start.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-bout-en-bout
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - if: always()
        run: npx supabase stop --no-backup

  tests-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: scripts/tests-sql.sh

  tests-sous-chapitres-local:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Le navigateur contrôle aussi les 331 SVG contre les deux SHA historiques.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Postgres jetable dédié à #92
        run: |
          docker run -d --name kffr-issue92-phase2 --label kffr.audit=issue92-phase2 -e POSTGRES_PASSWORD=fixture-issue92 postgres:17
          for attempt in $(seq 1 30); do
            docker exec kffr-issue92-phase2 pg_isready -U postgres && exit 0
            sleep 1
          done
          exit 1
      - run: npx tsx scripts/test-sous-chapitres-local.ts --container kffr-issue92-phase2
      - run: npx tsx scripts/test-import-sous-chapitres-http-local.ts --container kffr-issue92-phase2
      - run: npx playwright install --with-deps chromium
      - run: npx tsx scripts/test-import-sous-chapitres-http-local.ts --container kffr-issue92-phase2 --corpus-phase3 --release92 --han117 --build-phase3
      - if: always()
        run: docker rm -f kffr-issue92-phase2
